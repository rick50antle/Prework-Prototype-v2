<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Pre-Work — Welcome</title>
    <link href="lib/font-3.css" rel="stylesheet">
    <script src="lib/tailwind.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="lib/react.production.min.js"></script>
    <script src="lib/react-dom.production.min.js"></script>
    <script src="lib/babel.min.js?v=7"></script>
    <script type="text/babel">
        const { useState } = React;

        const colors = {
            primary: '#00356b',
            sand: '#f5f1e8',
            earth: '#8b7355',
            earthLight: '#d4c4a8',
            earthDark: '#5c4d3d',
            accent: '#c9a227',
            clay: '#c4a574',
            clayLight: '#e8dcc8',
            clayDark: '#a08050',
            success: '#22c55e',
            successBg: '#f0fdf4',
            warning: '#f59e0b',
            warningBg: '#fffbeb',
            error: '#dc2626',
            errorBg: '#fef2f2',
        };

        // Roadmap data. Module 1 is live (links into Tutorials-v2); every other module is a placeholder.
        const roadmap = [
            {
                id: 'welcome',
                module: 'Welcome',
                title: 'Course orientation',
                desc: 'You are here',
                active: true,
                activities: null,
            },
            {
                id: 'm1',
                module: 'Module 1 · The Journey',
                title: 'Making sense of the repair work',
                desc: 'The first months of fixing bikes for money — before there’s any “shop,” you set the work apart from the rest of your life, and the habits that let you read any set of books get built, transaction by transaction.',
                activities: [
                    { num: '1.1', title: 'Getting Organized', href: '11-getting-organized.html', tag: null },
                    { num: '1.2', title: 'Insurance and Maria', href: '12-insurance-and-maria.html', tag: null },
                    { num: '1.3', title: 'Anna and the Bank Statement', href: '13-anna-and-the-bank-statement.html', tag: null },
                    // 1.4 points at the v3 redesign sandbox while it's under review; flip back to
                    // 14-keeping-reasons.html (or promote the sandbox) before publishing.
                    { num: '1.4', title: 'Keeping the Reasons', href: '14-keeping-reasons-2pane.html', tag: null },
                    { num: '1.5', title: 'Naming What You Built', href: '15-naming-what-you-built.html', tag: null },
                ],
            },
            {
                id: 'm2',
                module: 'Module 2 · Getting Formal',
                title: 'Choosing a form for the work',
                desc: 'What a formal structure does — and does not — change about the books.',
                placeholder: true,
                activities: null,
            },
            {
                id: 'm3',
                module: 'Module 3 · The Full Set of Statements',
                title: 'How the statements connect',
                desc: 'Beyond the balance sheet — the statements that explain how it changes from one period to the next.',
                placeholder: true,
                activities: null,
            },
            {
                id: 'm4',
                module: 'Module 4 · Real Statements',
                title: 'Working with real financial statements',
                desc: 'The same architecture, customized — seeing it at work in a real for-profit and a real nonprofit.',
                placeholder: true,
                activities: null,
            },
            {
                id: 'bonus',
                module: 'Bonus · Optional add-on',
                title: 'The Analyst’s Toolkit',
                desc: 'For going beneath the surface — where management made choices, where the records leave room for interpretation.',
                placeholder: true,
                optional: true,
                activities: null,
            },
        ];

        // Transcript of the ~40-second intro video (final script, 2026-06-12). Replaces the
        // original ~2-minute welcome; the long version is preserved in git history.
        const transcriptBeats = [
            { label: 'Three ways people meet accounting',
              text: '"People meet accounting in one of three ways. From fifty thousand feet — dropped into a corporation’s financial statements with no GPS, or even a map. Up close — as a pile of procedures and rules. Or from the middle — handed reports they’re expected to understand and use, and evaluated by numbers from a mysterious system."' },
            { label: 'A different approach',
              text: '"I’m Rick Antle. I teach accounting at Yale, and I’ve prepared this prework using a different approach: you experience the pain points built into the system by building one from the ground up."' },
            { label: 'Where it leads',
              text: '"We will start with a bike-repair side gig. And the lessons will carry — all the way to the financial statements of the most complex corporation, nonprofit, or government."' },
        ];

        const App = () => {
            const [transcriptOpen, setTranscriptOpen] = useState(false);
            const [expandedModules, setExpandedModules] = useState({});

            const toggleModule = (id) => {
                setExpandedModules({ ...expandedModules, [id]: !expandedModules[id] });
            };

            const TagPill = ({ kind }) => {
                if (!kind) return null;
                const styles = {
                    coming: { bg: '#f0e9d8', border: '#e0d3a8', color: '#8a6a1f', label: 'In progress' },
                    soon:   { bg: '#eef2f7', border: '#d6dde6', color: '#5b6b7d', label: 'Coming soon' },
                };
                const s = styles[kind];
                if (!s) return null;
                return (
                    <span className="text-xs font-semibold uppercase tracking-wide px-2 py-0.5 rounded-full"
                          style={{ backgroundColor: s.bg, border: `1px solid ${s.border}`, color: s.color }}>
                        {s.label}
                    </span>
                );
            };

            return (
                <div className="min-h-screen" style={{ backgroundColor: colors.sand }}>
                    <div className="p-4 max-w-3xl mx-auto">

                        {/* Top header strip — matches the tutorials */}
                        <div className="rounded-lg p-4 mb-4" style={{ backgroundColor: colors.primary }}>
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-lg font-bold text-white">Accounting Pre-Work</h1>
                                    <p className="text-sm mt-1" style={{ color: colors.earthLight }}>
                                        Welcome &middot; Yale School of Management
                                    </p>
                                </div>
                                <div className="text-right">
                                    <p className="text-xs" style={{ color: 'rgba(255,255,255,0.7)' }}>Rick Antle</p>
                                    <p className="text-xs" style={{ color: 'rgba(255,255,255,0.5)' }}>William S. Beinecke Professor of Accounting</p>
                                </div>
                            </div>
                        </div>

                        {/* Rick intro video + transcript (the ~40-second welcome — replaces the old prose + 2-minute video) */}
                        <div className="rounded-lg border-2 mb-4 p-4"
                             style={{ borderColor: colors.earthLight, backgroundColor: 'white' }}>
                            <p className="text-xs font-bold uppercase tracking-wide mb-3" style={{ color: colors.earth }}>
                                Welcome from Rick &middot; about 40 seconds
                            </p>
                            {/* Video placeholder */}
                            <div className="rounded-lg mx-auto mb-3 flex flex-col items-center justify-center"
                                 style={{ backgroundColor: '#111', maxWidth: '480px', padding: '48px 24px' }}>
                                <div className="rounded-full flex items-center justify-center mb-3 cursor-pointer hover:opacity-90"
                                     style={{
                                         width: '60px', height: '60px',
                                         backgroundColor: 'rgba(255,255,255,0.12)',
                                         border: '2px solid rgba(255,255,255,0.4)',
                                     }}>
                                    <div style={{
                                        width: 0, height: 0,
                                        borderTop: '11px solid transparent',
                                        borderBottom: '11px solid transparent',
                                        borderLeft: '18px solid rgba(255,255,255,0.7)',
                                        marginLeft: '4px',
                                    }}></div>
                                </div>
                                <p className="text-xs" style={{ color: 'rgba(255,255,255,0.6)' }}>Video placeholder</p>
                            </div>
                            <button
                                onClick={() => setTranscriptOpen(!transcriptOpen)}
                                className="text-sm border-0 bg-transparent cursor-pointer mx-auto block px-2 py-1"
                                style={{ color: colors.earth }}
                            >
                                <span className="inline-block mr-1" style={{ transform: transcriptOpen ? 'rotate(90deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }}>▶</span>
                                {transcriptOpen ? 'Hide transcript' : 'Read transcript'}
                            </button>

                            {transcriptOpen && (
                                <div className="mt-3 p-4 rounded-lg max-h-96 overflow-y-auto"
                                     style={{ backgroundColor: '#fafaf7', border: `1px solid ${colors.earthLight}` }}>
                                    {transcriptBeats.map((beat, i) => (
                                        <div key={i} className="mb-4 last:mb-0">
                                            <p className="text-xs font-bold uppercase tracking-wide mb-2"
                                               style={{ color: colors.primary }}>{beat.label}</p>
                                            <p className="text-sm leading-relaxed" style={{ color: colors.earthDark, fontFamily: 'Georgia, serif' }}>
                                                {beat.text}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Roadmap */}
                        <div className="mb-4">
                            <h2 className="text-lg font-bold mb-3" style={{ color: colors.primary }}>Your Roadmap</h2>
                            <p className="text-sm mb-4 leading-relaxed" style={{ color: colors.earthDark }}>
                                Module 1 is the journey itself &mdash; the sessions in which you build a way of reading any
                                set of books by first making sense of your own repair work, setting it apart from everything
                                else. The modules that follow carry the lessons further &mdash; all the way to the financial
                                statements of real organizations. Module 1 is ready now; the rest are on the way.
                            </p>

                            <div className="space-y-3">
                                {roadmap.map(item => {
                                    const muted = item.placeholder || item.optional;
                                    return (
                                    <div key={item.id}
                                         className="rounded-lg border-2"
                                         style={{
                                             backgroundColor: 'white',
                                             borderColor: item.active ? colors.accent : (muted ? '#e0e0e0' : colors.earthLight),
                                             borderStyle: item.optional ? 'dashed' : 'solid',
                                             opacity: item.placeholder ? 0.85 : 1,
                                         }}>
                                        <div className="p-4 flex items-start gap-3">
                                            {/* Dot */}
                                            <div className="flex-shrink-0 mt-1">
                                                <div className="rounded-full"
                                                     style={{
                                                         width: item.active ? '14px' : '10px',
                                                         height: item.active ? '14px' : '10px',
                                                         backgroundColor: item.active ? colors.accent : (muted ? 'white' : colors.earth),
                                                         border: muted ? `2px solid ${colors.earthLight}` : 'none',
                                                     }}></div>
                                            </div>
                                            <div className="flex-grow">
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <p className="text-xs font-bold uppercase tracking-wide"
                                                       style={{ color: item.active ? colors.accent : (muted ? '#999' : colors.earth) }}>
                                                        {item.module}
                                                    </p>
                                                    {item.placeholder && <TagPill kind="soon" />}
                                                </div>
                                                <p className="text-base font-medium mt-0.5" style={{ color: colors.earthDark }}>
                                                    {item.title}
                                                </p>
                                                <p className="text-sm mt-1 italic" style={{ color: colors.earth }}>
                                                    {item.desc}
                                                </p>
                                            </div>
                                            {item.activities && (
                                                <button
                                                    onClick={() => toggleModule(item.id)}
                                                    className="flex-shrink-0 text-xs font-bold uppercase tracking-wide border rounded px-2 py-1 cursor-pointer"
                                                    style={{
                                                        color: colors.earth,
                                                        borderColor: colors.earthLight,
                                                        backgroundColor: 'transparent',
                                                    }}
                                                >
                                                    {expandedModules[item.id] ? 'Hide' : 'Activities'}
                                                    <span className="inline-block ml-1"
                                                          style={{ transform: expandedModules[item.id] ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 0.2s' }}>
                                                        ▾
                                                    </span>
                                                </button>
                                            )}
                                        </div>
                                        {item.activities && expandedModules[item.id] && (
                                            <div className="border-t pl-12 pr-4 py-2"
                                                 style={{ borderColor: colors.earthLight, backgroundColor: '#fafaf7' }}>
                                                {item.activities.map(a => {
                                                    const isClickable = a.href !== null && a.tag !== 'coming';
                                                    const content = (
                                                        <div className="flex items-center gap-3 py-2">
                                                            <div className="flex-shrink-0 rounded-full"
                                                                 style={{
                                                                     width: '7px', height: '7px',
                                                                     backgroundColor: isClickable ? colors.earth : 'white',
                                                                     border: isClickable ? 'none' : `1px solid ${colors.earthLight}`,
                                                                 }}></div>
                                                            <span className="text-sm flex-grow"
                                                                  style={{ color: isClickable ? colors.earthDark : colors.earth }}>
                                                                <span className="font-medium">{a.num}</span>
                                                                <span className="mx-2">&middot;</span>
                                                                {a.title}
                                                            </span>
                                                            <TagPill kind={a.tag} />
                                                        </div>
                                                    );
                                                    return isClickable ? (
                                                        <a key={a.num} href={a.href} className="block no-underline hover:bg-white px-2 -mx-2 rounded">
                                                            {content}
                                                        </a>
                                                    ) : (
                                                        <div key={a.num} className="px-2 -mx-2">{content}</div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Fresh-mind ask (kept from the old welcome's beat 5) + transition + Begin button */}
                        <p className="italic mb-2 mt-6 pt-4 border-t leading-relaxed text-sm"
                           style={{ color: colors.earth, borderColor: colors.earthLight }}>
                            Studied accounting before? Set it aside for now &mdash; build the thing fresh, and see if it
                            looks the same from this angle.
                        </p>
                        <p className="italic mb-4 leading-relaxed text-sm"
                           style={{ color: colors.earth }}>
                            When you’re ready, the journey starts with a sort &mdash; ten things scattered between the rented space and home, six months in.
                        </p>

                        <a href="11-getting-organized.html"
                           className="block w-full py-3 rounded-lg font-bold text-white text-center no-underline"
                           style={{ backgroundColor: colors.primary }}>
                            Begin Module 1 &rarr; Activity 1.1: Getting Organized
                        </a>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
